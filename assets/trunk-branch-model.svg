<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">主干—分支模型</title>
  <desc id="desc">核心驱动确定项目根本目标。目标向上展开为阶段目标与推进方法，再分为具体任务。现实反馈返回方法，必要时重新审视目标。五步法、第一性原理和帕累托原则贯穿三个层面。</desc>
  <defs>
    <marker id="up" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#61756a"/></marker>
    <marker id="feedback" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#9b6b39"/></marker>
    <style>
      text { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', sans-serif; fill: #27352f; }
      .title { font-size: 27px; font-weight: 700; }
      .layer { font-size: 24px; font-weight: 700; }
      .method { font-size: 17px; fill: #4d5d56; }
      .tag { font-size: 14px; letter-spacing: 2px; fill: #65766e; }
      .node { font-size: 20px; font-weight: 600; }
      .small { font-size: 16px; fill: #4d5d56; }
      .feedback-label { font-size: 16px; fill: #85582b; }
      .link { fill: none; stroke: #61756a; stroke-width: 2.4; stroke-linejoin: round; marker-end: url(#up); }
      .return { fill: none; stroke: #9b6b39; stroke-width: 2; stroke-dasharray: 7 6; stroke-linejoin: round; marker-end: url(#feedback); }
    </style>
  </defs>
  <rect width="1160" height="760" fill="#ffffff"/>
  <text x="32" y="46" class="title">主干—分支模型</text>
  <text x="32" y="75" class="small">目标逐层展开，反馈逐层修正。</text>

  <rect x="24" y="102" width="1112" height="190" rx="14" fill="#f0f5f8"/>
